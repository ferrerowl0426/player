<style>
/* ============================================================
   学员首页 · 左「练习要求 / 提交要求」/ 右「今日学习资源」（含停用态）
   视觉遵循 design-spec v2.0：纯白底 / 焦糖格纹 / 咖啡描边 / 亮橙强调
============================================================ */
:root{
  --paper:  #f2ead9;
  --white:  #ffffff;
  --ink:    #261d10;
  --ink-2:  #4f4230;
  --ink-3:  #7a6a52;
  --hair:   #ddd0b4;
  --hair-2: #c9b795;
  --coffee: #5d4326;
  --orange: #ff7f00;
  --amber:  #b98e3e;
  --green:  #4f7d3a;
  --wood:   #3a2a18;
  --glass:      rgba(255, 255, 255, .85);
  --glass-line: rgba(93, 67, 38, .32);
  --pc-paper:   #fffdf7;   /* 信纸纸色 */
  --pc-ink:     #3a2c1c;   /* 信纸书写墨色 */
  --pc-line:    rgba(122, 74, 38, .13);
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --font-hand: "Kaiti SC", "STKaiti", "KaiTi", "楷体", "Songti SC", serif;
  --ease: cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{height:100%}
body{
  min-height:100%;
  font-family:var(--font-body);
  background:#ffffff;  /* 纯白底 + 格纹底饰（design-spec v2.0 §3） */
  color:var(--ink);
  font-size:14.5px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
}
/* 格纹底饰：焦糖咖啡色 · 下浓上淡 · 近页头逐渐消失（design-spec v2.0 §3） */
body::after{display:none}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    repeating-linear-gradient(90deg, rgba(122,74,38,.16) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(0deg,  rgba(122,74,38,.16) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(90deg, rgba(122,74,38,.06) 0 1px, transparent 1px 18px),
    repeating-linear-gradient(0deg,  rgba(122,74,38,.06) 0 1px, transparent 1px 18px);
  -webkit-mask:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.12) 30%, rgba(0,0,0,.55) 62%, #000 100%);
          mask:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.12) 30%, rgba(0,0,0,.55) 62%, #000 100%);
}
::selection{background:#ecd9ae}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* ============ 导航（学员视角） ============ */
.nav{
  position:relative;flex:none;z-index:50;
  background:var(--white);
  border-bottom:1px solid var(--glass-line);
  box-shadow:0 1px 8px rgba(64,45,20,.07);
}
.nav::before{
  content:"";position:absolute;bottom:0;left:0;right:0;height:3px;
  background:var(--coffee);
}
.nav-inner{max-width:1440px;margin:0 auto;padding:0 36px;height:56px;display:flex;align-items:center;gap:40px;position:relative}
.logo{display:flex;align-items:baseline;gap:9px;font-size:15.5px;font-weight:700;letter-spacing:3px;color:var(--ink);text-decoration:none}
.logo .mark{width:9px;height:9px;background:var(--orange);flex:none;align-self:center}
.logo small{font-size:10px;letter-spacing:2px;color:var(--ink-3);font-weight:400}
.nav-links{display:flex;gap:32px;flex:1}
.nav-links a{
  color:var(--ink-2);text-decoration:none;font-size:13px;letter-spacing:1px;
  padding:4px 3px 7px;position:relative;transition:color .3s var(--ease);
}
.nav-links a.active{
  color:var(--ink);font-weight:600;
  background:linear-gradient(180deg, transparent 58%, rgba(255,127,0,.42) 58%);
}
.nav-links a:hover{color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:18px}
.avatar{
  position:relative;width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--coffee);background:var(--white);
  display:grid;place-items:center;font-size:12.5px;color:var(--coffee);font-weight:600;
}
.avatar::after{
  content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;
  background:var(--green);border:1.5px solid var(--paper);
}

/* ============ 主区 ============ */
.home{
  flex:1 0 auto;max-width:1440px;width:100%;margin:0 auto;
  padding:14px 36px 36px;display:flex;flex-direction:column;gap:16px;
}

/* ---- 问候行 ---- */
.greet{flex:none;display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.greet h1{font-size:20px;font-weight:700;letter-spacing:1px;line-height:1.4}
.greet .sub{font-size:11px;color:var(--ink-3);letter-spacing:.5px;padding-bottom:3px}
.viewseg{margin-left:auto;display:flex;align-items:center;gap:0;border:1px solid var(--hair-2);border-radius:4px;overflow:hidden;background:var(--white)}
.viewseg .lbl{font-size:10px;letter-spacing:1.5px;color:var(--ink-3);padding:0 10px;border-right:1px dashed var(--hair-2)}
.viewseg button{font-size:11px;letter-spacing:1px;color:var(--ink-3);padding:5px 13px;transition:all .25s}
.viewseg button + button{border-left:1px solid var(--hair)}
.viewseg button.on{background:var(--coffee);color:var(--white);font-weight:600}

/* ---- 停用横幅（纸条） ---- */
.stop-banner{
  flex:none;display:none;align-items:flex-start;gap:12px;
  border:1.5px dashed rgba(180,69,46,.55);border-radius:6px;
  background:rgba(255,252,242,.85);
  padding:12px 18px;
}
body.disabled .stop-banner{display:flex}
.stop-banner .ico{
  flex:none;width:30px;height:30px;border-radius:50%;margin-top:2px;
  border:1.5px solid rgba(180,69,46,.5);background:rgba(180,69,46,.06);
  display:grid;place-items:center;color:#b4452e;
}
.stop-banner .ico svg{width:15px;height:15px}
.stop-banner .t{font-size:12.5px;color:var(--ink);letter-spacing:.5px;line-height:1.8}
.stop-banner .t b{color:#b4452e}

/* ============ 左右分区 ============ */
.cols{
  flex:1 0 auto;
  display:grid;gap:24px;
  grid-template-columns:minmax(0,45fr) minmax(0,55fr);
  align-items:stretch;
}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
.sec.assignment-sec,.sec.requirement-sec{min-height:0}
.sec.requirement-sec .req-stack,.sec.assignment-sec .grid{flex:1 1 auto}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:0 2px}
.sec-head h2{
  font-size:15px;font-weight:700;letter-spacing:2px;color:var(--coffee);
  display:flex;align-items:center;gap:9px;
}
.sec-head h2::before{content:"";width:4px;height:15px;border-radius:1px;flex:none;background:var(--orange)}
.sec-head .meta{font-size:10.5px;color:var(--ink-3);letter-spacing:1px}
.sec-head .note{margin-left:auto;font-size:10.5px;color:var(--ink-3);letter-spacing:.5px}

/* ============ 左：练习要求 / 提交要求 ============ */
.req-stack{
  display:grid;gap:14px;
  grid-template-rows:var(--req-rows, auto);
  flex:1 1 auto;min-height:0;
}
.req-card{
  min-height:0;
  height:var(--req-card-h, auto);
  background:var(--white);
  border:1px solid var(--hair-2);
  border-radius:6px;
  box-shadow:0 1px 3px rgba(93,67,38,.08), 0 4px 12px rgba(93,67,38,.05);
  padding:14px 16px;
  display:flex;flex-direction:column;gap:10px;
}
.req-card.empty{display:none}
.req-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex:none}
.req-title{font-size:13px;font-weight:700;letter-spacing:1.6px;color:var(--coffee)}
.req-meta{font-size:10px;color:var(--ink-3);letter-spacing:.8px;white-space:nowrap}
.req-text{
  flex:1 1 auto;min-height:0;max-height:none;
  overflow-y:auto;overscroll-behavior:contain;
  scrollbar-width:thin;scrollbar-color:var(--hair-2) transparent;
  white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;
  font-size:13px;line-height:1.75;color:var(--ink-2);letter-spacing:.35px;
  background:transparent;border:1px dashed rgba(93,67,38,.18);border-radius:4px;
  padding:8px 10px;
}
.req-text::-webkit-scrollbar{width:6px}.req-text::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:999px}

/* ============ 右：今日学习资源（直排无框） ============ */
.grid{
  display:grid;gap:14px;
  grid-template-columns:repeat(3, minmax(0,1fr));
  grid-auto-rows:auto;
  align-content:start;
}
.hw{
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;
  border:1px solid var(--hair-2);border-radius:6px;background:var(--white);
  box-shadow:0 1px 3px rgba(93,67,38,.08), 0 4px 12px rgba(93,67,38,.06);
  padding:7px;transition:all .3s var(--ease);
}
.hw:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(93,67,38,.14)}
.hw .cover{
  position:relative;width:100%;aspect-ratio:1/1;border-radius:4px;overflow:hidden;
  background:var(--wood) center/cover no-repeat;display:grid;place-items:center;
}
.hw .cover .p-tag{
  position:absolute;right:7px;bottom:7px;z-index:2;
  font-size:9px;letter-spacing:1px;font-weight:700;color:var(--white);
  background:rgba(93,67,38,.88);border-radius:3px;padding:2px 8px;
}
.hw .cover .go{
  position:absolute;inset:0;z-index:3;display:grid;place-items:center;
  background:rgba(38,26,12,.32);opacity:0;transition:opacity .3s var(--ease);
}
.hw:hover .cover .go{opacity:1}
.hw .cover .go span{
  font-size:11px;letter-spacing:3px;font-weight:600;color:var(--coffee);
  background:rgba(255,255,255,.92);border:1.5px solid var(--coffee);border-radius:4px;
  padding:6px 16px;box-shadow:2px 3px 0 rgba(38,26,12,.25);
}
.kind-chip{
  position:absolute;left:7px;top:7px;z-index:2;
  font-size:9px;letter-spacing:1.5px;font-weight:600;color:var(--white);
  background:var(--orange);border-radius:3px;padding:2px 8px;
}
.kind-chip.k-set{background:#8a5a12}
.hw .nm{
  font-size:12px;font-weight:600;letter-spacing:.3px;line-height:1.5;margin-top:7px;
  height:1.5em;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
}
.hw .from{font-size:9.5px;color:var(--ink-3);letter-spacing:.4px;margin-top:5px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.hw .from .tk{flex:none;width:14px;height:14px;border-radius:50%;border:1px solid var(--hair-2);display:inline-grid;place-items:center;font-size:8px;color:var(--coffee)}
.hw-empty{
  grid-column:1/-1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:60px 10px;text-align:center;color:var(--ink-3);font-size:12.5px;letter-spacing:.5px;
}
.hw-empty .big{font-size:15px;color:var(--ink);font-weight:700;letter-spacing:1px}

.rise{opacity:0;transform:translateY(12px);animation:rise .7s var(--ease) forwards}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.rise{opacity:1;transform:none;animation:none}}

@media (max-width:1180px){
  .grid{grid-template-columns:repeat(2, minmax(0,1fr))}
}
@media (max-width:1024px){
  .home{padding:14px 20px 40px}
  .cols{grid-template-columns:1fr;gap:22px}
  .req-stack{height:auto;grid-template-rows:none;flex:none}
  .req-card{height:auto;min-height:150px}
}
@media (max-width:640px){
  .nav-inner{padding:0 20px}
  .nav-links{display:none}
  .home{padding:12px 14px 32px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .viewseg{margin-left:0}
  .greet{align-items:center}
  .req-stack{gap:12px}
  .req-card{padding:12px 13px;min-height:142px}
  .req-text{font-size:12.5px}
}
</style>

<script>
/* ================= 假数据（≤5 项 · 单 P 用所属单课封面） ================= */
const HW = [
  {kind:'单课', nm:'卡农独奏 · 全曲精讲',   img:'assets/covers/real-01.jpg', from:'李弦安', t:'昨天 20:30', href:'track-point-detail.html'},
  {kind:'P2',  nm:'卡农 · P2 分段讲解',    img:'assets/covers/real-01.jpg',           from:'李弦安', t:'昨天 20:30', href:'track-point-detail.html'},
  {kind:'合集', nm:'指弹入门 30 首',        img:'assets/covers/real-15.jpg',         from:'李弦安', t:'3 天前',    href:'track-collection-detail.html'},
  {kind:'单课', nm:'天空之城 · 指弹改编',   img:'assets/covers/real-02.jpg',                                        from:'李弦安', t:'4 天前',    href:'#'},
  {kind:'P3',  nm:'晴天 · P1 前奏演示',    img:'assets/covers/real-06.jpg',                 from:'李弦安', t:'1 周前',    href:'#'},
];

/* ================= 渲染 ================= */
const grid = document.getElementById('hwGrid');
const reqStack = document.querySelector('.req-stack');
function syncRequirementRows(){
  if (!reqStack || window.matchMedia('(max-width: 1024px)').matches) {
    reqStack?.style.removeProperty('--req-rows');
    document.documentElement.style.removeProperty('--req-card-h');
    return;
  }
  const cards = [...reqStack.querySelectorAll('.req-card:not(.empty)')];
  const resources = [...grid.querySelectorAll('.hw')];
  if (!cards.length || !resources.length) return;
  const rows = [];
  for (let i = 0; i < resources.length; i += 3) {
    const row = resources.slice(i, i + 3);
    rows.push(Math.max(...row.map(card => card.getBoundingClientRect().height)));
  }
  const rowHeights = cards.map((_, index) => {
    if (rows[index] != null) return Math.max(150, Math.floor(rows[index]));
    const average = rows.reduce((sum, value) => sum + value, 0) / rows.length;
    return Math.max(150, Math.floor(average));
  });
  reqStack.style.setProperty('--req-rows', rowHeights.map(value => `${value}px`).join(' '));
  document.documentElement.style.setProperty('--req-card-h', 'auto');
}
function render(){
  document.getElementById('hwMeta').textContent = '老师布置了 ' + HW.length + ' 项';
  grid.innerHTML = HW.map(h=>
    '<a class="hw" href="' + h.href + '">' +
      '<div class="cover" style="background-image:url(\'' + h.img + '\')">' +
        '<span class="kind-chip' + (h.kind==='合集'?' k-set':'') + '">' + h.kind + '</span>' +
        (h.kind.charAt(0) === 'P' ? '<span class="p-tag num">' + h.kind + '</span>' : '') +
        '<span class="go"><span>开始学习</span></span>' +
      '</div>' +
      '<div class="nm">' + h.nm + '</div>' +
      '<div class="from num"><span class="tk">' + h.from[0] + '</span>' + h.from + ' · ' + h.t + '</div>' +
    '</a>'
  ).join('') + (HW.length ? '' :
    '<div class="hw-empty"><span class="big">今天还没有作业</span><span>去曲目库和图书馆逛逛，或查看历史作业复习</span></div>');
}
render();
requestAnimationFrame(syncRequirementRows);
window.addEventListener('resize', syncRequirementRows);

/* ================= 视角切换（学员 / 停用学员） ================= */
document.querySelectorAll('.viewseg button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.viewseg button').forEach(x=>x.classList.toggle('on', x===b));
    document.body.classList.toggle('disabled', b.dataset.v === 'disabled');
  });
});
</script>
