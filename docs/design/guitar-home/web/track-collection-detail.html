<title>曲目合集详情 · 能学慧吉他教室</title>
<style>
/* ============================================================
   合集详情 · 合集标题 / 简介 / 收录单曲排列
   知识点集与曲目集共用此模板；视觉遵循 design-spec v2.0
============================================================ */
:root{
  --paper:  #f2ead9;
  --white:  #ffffff;
  --ink:    #261d10;
  --ink-2:  #4f4230;
  --ink-3:  #7a6a52;
  --hair:   #ddd0b4;
  --hair-2: #c9b795;
  --coffee: #5d4326;
  --orange: #ff7f00;
  --amber:  #b98e3e;
  --green:  #4f7d3a;
  --wood:   #3a2a18;
  --glass:      rgba(255, 255, 255, .85);
  --glass-line: rgba(93, 67, 38, .32);
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --ease: cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  height:100vh;                 /* 一屏内呈现：不整页滚动，超出的单曲靠翻页 */
  font-family:var(--font-body);
  background:#ffffff;
  color:var(--ink);
  font-size:14.5px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  overflow:hidden;
}
/* 格纹底饰：焦糖咖啡色 · 下浓上淡 · 近页头逐渐消失 */
body::after{display:none}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    repeating-linear-gradient(90deg, rgba(122,74,38,.16) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(0deg,  rgba(122,74,38,.16) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(90deg, rgba(122,74,38,.06) 0 1px, transparent 1px 18px),
    repeating-linear-gradient(0deg,  rgba(122,74,38,.06) 0 1px, transparent 1px 18px);
  -webkit-mask:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.12) 30%, rgba(0,0,0,.55) 62%, #000 100%);
          mask:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.12) 30%, rgba(0,0,0,.55) 62%, #000 100%);
}
::selection{background:#ecd9ae}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* ============ 导航 ============ */
.nav{
  position:relative;flex:none;z-index:50;
  background:var(--white);
  border-bottom:1px solid var(--glass-line);
  box-shadow:0 1px 8px rgba(64,45,20,.07);
}
.nav::before{content:"";position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--coffee)}
.nav-inner{max-width:1440px;margin:0 auto;padding:0 36px;height:56px;display:flex;align-items:center;gap:40px;position:relative}
.logo{display:flex;align-items:baseline;gap:9px;font-size:15.5px;font-weight:700;letter-spacing:3px;color:var(--ink);text-decoration:none}
.logo .mark{width:9px;height:9px;background:var(--orange);flex:none;align-self:center}
.logo small{font-size:10px;letter-spacing:2px;color:var(--ink-3);font-weight:400}
.nav-links{display:flex;gap:32px;flex:1}
.nav-links a{
  color:var(--ink-2);text-decoration:none;font-size:13px;letter-spacing:1px;
  padding:4px 3px 7px;position:relative;transition:color .3s var(--ease);
}
.nav-links a.active{
  color:var(--ink);font-weight:600;
  background:linear-gradient(180deg, transparent 58%, rgba(255,127,0,.42) 58%);
}
.nav-links a:hover{color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:18px}
.avatar{
  position:relative;width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--coffee);background:var(--white);
  display:grid;place-items:center;font-size:12.5px;color:var(--coffee);font-weight:600;
}
.avatar::after{
  content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;
  background:var(--green);border:1.5px solid var(--paper);
}

/* ============ 主区（一屏内：头 / 列表 / 翻页三段式） ============ */
.home{
  flex:1;min-height:0;max-width:1200px;width:100%;margin:0 auto;
  padding:12px 36px 18px;display:flex;flex-direction:column;gap:14px;
}

/* ---- 面包屑 ---- */
.crumb{flex:none;display:flex;align-items:center;gap:9px;font-size:11.5px;letter-spacing:.5px;color:var(--ink-3)}
.crumb a{color:var(--coffee);text-decoration:none;font-weight:600;transition:color .25s}
.crumb a:hover{color:var(--orange)}
.crumb .sep{color:var(--hair-2)}
.crumb .cur{color:var(--ink-2)}

/* ============ 合集头（压缩高度，给列表让出空间） ============ */
.c-head{
  flex:none;
  display:flex;gap:22px;align-items:flex-start;
  border:1px solid var(--hair-2);border-radius:6px;background:var(--white);
  box-shadow:0 1px 3px rgba(93,67,38,.08), 0 6px 16px rgba(93,67,38,.07);
  padding:15px 22px;
}
.c-cover{flex:none;width:140px}
.c-cover .cover{
  width:100%;aspect-ratio:1/1;border-radius:6px;position:relative;overflow:hidden;
  background:var(--wood);display:grid;place-items:center;
}
.c-cover .disc{position:absolute;inset:9%;border-radius:50%;background:var(--coffee);display:grid;place-items:center}
.c-cover .disc::before{content:"";position:absolute;inset:16%;border-radius:50%;border:1px solid rgba(242,234,217,.4)}
.c-cover .disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--white)}
.c-cover .disc i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--rot,20deg), rgba(242,234,217,.08) 0 16deg, transparent 16deg 42deg)}
.c-cover .disc .lbl{width:15%;height:15%;border-radius:50%;background:var(--white);position:relative;z-index:1;display:grid;place-items:center}
.c-cover .disc .lbl i{width:6px;height:6px;border-radius:50%;background:var(--orange)}
/* 叠碟（合集） */
.c-cover .stack-l1,.c-cover .stack-l2{position:absolute;left:8%;right:8%;height:10px;border-radius:3px}
.c-cover .stack-l2{bottom:6%;background:rgba(93,67,38,.18)}
.c-cover .stack-l1{left:4%;right:4%;bottom:11%;background:rgba(93,67,38,.3)}
.c-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:1px}
.c-chip{
  align-self:flex-start;font-size:9.5px;letter-spacing:2px;font-weight:700;color:var(--white);
  background:var(--orange);border-radius:3px;padding:2px 9px;
}
.c-info h1{font-size:19px;font-weight:700;letter-spacing:1px;line-height:1.35}
.c-meta{font-size:11px;color:var(--ink-3);letter-spacing:.6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.c-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--hair-2);flex:none}
.c-desc{
  font-size:12.5px;line-height:1.9;color:var(--ink-2);letter-spacing:.4px;
  border-left:3px solid var(--hair-2);padding:1px 0 1px 14px;margin-top:1px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}

/* ---- 关联图书馆：合集页采用头部右侧紧凑展示，不挤占单曲网格 ---- */
.c-lib{
  flex:none;width:248px;align-self:stretch;display:flex;flex-direction:column;
  border-left:1px dashed var(--hair-2);padding-left:18px;min-width:0;
}
.c-lib-head{display:flex;align-items:baseline;gap:8px;margin-bottom:7px}
.c-lib-head h2{font-size:13px;font-weight:700;letter-spacing:1.5px;color:var(--coffee)}
.c-lib-head .count{font-size:10px;color:var(--ink-3);letter-spacing:.4px}
.c-lib-note{font-size:10px;color:var(--ink-3);letter-spacing:.3px;margin-bottom:8px}
.c-lib-list{display:flex;flex-direction:column;gap:5px;overflow:auto;max-height:110px;scrollbar-width:thin;scrollbar-color:var(--hair-2) transparent}
.c-lib-list::-webkit-scrollbar{width:4px}
.c-lib-list::-webkit-scrollbar-thumb{background:var(--hair-2)}
.c-lib-item{display:flex;align-items:center;gap:7px;min-width:0;padding:5px 7px;background:rgba(255,127,0,.045);border:1px solid rgba(185,142,62,.45);border-radius:4px;color:var(--ink-2);text-decoration:none;transition:background .2s,border-color .2s}
.c-lib-item:hover{background:rgba(255,127,0,.1);border-color:var(--orange)}
.c-lib-item .book-mark{flex:none;width:16px;height:19px;border:1px solid var(--amber);border-radius:2px 3px 3px 2px;display:grid;place-items:center;color:var(--amber);font-size:8px;line-height:1}
.c-lib-item .book-name{min-width:0;flex:1;font-size:11px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-lib-item .book-meta{flex:none;font-size:9px;color:var(--ink-3);white-space:nowrap}
.c-lib-empty{font-size:10.5px;color:var(--ink-3);padding:10px 8px;border:1px dashed var(--hair-2);border-radius:4px;text-align:center}


/* ============ 收录单曲（固定 2 行 × 6 列 = 每页 12 个，不滚动） ============ */
.sec{flex:1;min-height:0;display:flex;flex-direction:column;gap:9px}
.sec-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:0 2px;flex:none}
.sec-head h2{
  font-size:15px;font-weight:700;letter-spacing:2px;color:var(--coffee);
  display:flex;align-items:center;gap:9px;
}
.sec-head h2::before{content:"";width:4px;height:15px;border-radius:1px;flex:none;background:var(--orange)}
.sec-head .meta{font-size:10.5px;color:var(--ink-3);letter-spacing:1px}
.sec-head .note{margin-left:auto;font-size:10.5px;color:var(--ink-3);letter-spacing:.5px}

.grid{
  flex:1;min-height:0;
  display:grid;gap:13px;
  grid-template-columns:repeat(6, minmax(0,1fr));
  grid-template-rows:repeat(2, minmax(0,1fr));   /* 两行铺满可用高度 */
}
.card{
  text-decoration:none;color:inherit;
  display:flex;flex-direction:column;height:100%;min-height:0;
  border:1px solid var(--hair-2);border-radius:6px;background:var(--white);
  box-shadow:0 1px 3px rgba(93,67,38,.08), 0 4px 12px rgba(93,67,38,.06);
  padding:8px;transition:all .3s var(--ease);
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(93,67,38,.13)}
.card .cover{
  flex:1;min-height:0;border-radius:4px;position:relative;
  display:grid;place-items:center;
}
/* 唱片恒为圆：按封面高度取直径，避免容器非正方时被压扁 */
.card .disc{height:90%;aspect-ratio:1/1;position:relative;border-radius:50%;background:var(--wood);display:grid;place-items:center}
.card .disc::before{content:"";position:absolute;inset:16%;border-radius:50%;border:1px solid rgba(242,234,217,.4)}
.card .disc::after{content:"";position:absolute;inset:36%;border-radius:50%;background:var(--white)}
.card .cover.c2 .disc{background:var(--coffee)}
.card .cover.c3 .disc{background:var(--amber)}
.card .cover.c4 .disc{background:#6b4d2e}
.card .cover.c5 .disc{background:#8c5a2b}
.card .cover.c6 .disc{background:#5c5340}
.card .disc i{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from var(--rot,20deg), rgba(242,234,217,.08) 0 16deg, transparent 16deg 42deg)}
.card .disc .lbl{width:15%;height:15%;border-radius:50%;background:var(--white);position:relative;z-index:1;display:grid;place-items:center}
.card .disc .lbl i{width:6px;height:6px;border-radius:50%;background:var(--orange)}
.card .name{font-size:12.5px;font-weight:600;letter-spacing:.3px;line-height:1.5;margin-top:8px;flex:none;height:1.5em;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{font-size:10.5px;color:var(--ink-3);letter-spacing:.4px;margin-top:2px;display:flex;align-items:center;gap:6px;flex:none;white-space:nowrap;overflow:hidden}
.card .meta .cnt-chip{
  font-size:9.5px;color:var(--coffee);border:1px solid var(--hair-2);
  border-radius:3px;padding:0 6px;letter-spacing:.5px;
}
.card .idx{
  position:absolute;left:7px;top:7px;z-index:2;
  font-size:9px;letter-spacing:1px;font-weight:700;color:var(--white);
  background:rgba(93,67,38,.85);border-radius:3px;padding:2px 7px;
}

/* ---- 预览视角切换（与曲库 / 图书馆页一致） ---- */
.viewseg{margin-left:auto;display:flex;align-items:center;gap:0;border:1px solid var(--hair-2);border-radius:4px;overflow:hidden;background:var(--white)}
.viewseg .lbl{font-size:10px;letter-spacing:1.5px;color:var(--ink-3);padding:0 10px;border-right:1px dashed var(--hair-2)}
.viewseg button{
  font-size:11px;letter-spacing:1px;color:var(--ink-3);padding:5px 13px;
  transition:all .25s;
}
.viewseg button + button{border-left:1px solid var(--hair)}
.viewseg button.on{background:var(--coffee);color:var(--white);font-weight:600}

/* ---- 教导主任视角：卡片封面悬停操作层（查看详情 / 编辑 / 删除） ---- */
.card .ops{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;
  display:none;flex-direction:column;gap:1px;
  background:rgba(251,247,236,.66);
  border:1px solid rgba(93,67,38,.26);border-radius:5px;
  padding:3px;
  backdrop-filter:blur(7px) saturate(1.15);-webkit-backdrop-filter:blur(7px) saturate(1.15);
  box-shadow:0 6px 18px rgba(60,42,20,.16);
}
body.dean .card:hover .ops{display:flex}
.card .ops button{
  flex:none;font-size:10px;letter-spacing:.5px;color:var(--coffee);
  border:none;border-radius:3px;padding:4px 9px;background:transparent;
  transition:all .2s;white-space:nowrap;cursor:pointer;
}
.card .ops button:hover{background:rgba(93,67,38,.1)}
.card .ops button.op-del:hover{background:rgba(180,69,46,.12);color:#b4452e}
/* ---- 删除二次确认弹层 ---- */
.modal-mask{
  position:fixed;inset:0;z-index:100;display:none;place-items:center;
  background:rgba(60,42,20,.38);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.modal-mask.show{display:grid}
.modal{
  width:320px;background:var(--white);border:1.5px solid var(--coffee);border-radius:8px;
  box-shadow:0 12px 32px rgba(60,42,20,.18);padding:20px 22px;
  animation:modal-pop .25s var(--ease);
}
@keyframes modal-pop{from{transform:scale(.94);opacity:0}}
.modal .modal-title{
  font-size:14px;font-weight:700;letter-spacing:2px;color:var(--coffee);
  margin-bottom:10px;padding-bottom:9px;border-bottom:1px dashed var(--hair-2);
}
.modal p{font-size:12px;line-height:1.9;color:var(--ink);margin:0 0 16px;letter-spacing:.3px}
.modal p b{color:#b4452e}
.modal .modal-ops{display:flex;gap:10px;justify-content:flex-end}
.mbtn{
  font-size:11.5px;letter-spacing:1px;padding:5px 16px;border-radius:4px;
  border:1px solid var(--hair-2);color:var(--ink-3);background:var(--white);
  transition:all .2s;cursor:pointer;
}
.mbtn:hover{border-color:var(--coffee);color:var(--coffee)}
.mbtn.danger{color:var(--white);background:var(--orange);border-color:var(--orange)}
.mbtn.danger:hover{background:#b4452e;border-color:#b4452e}
.dean-toast{
  position:fixed;left:50%;bottom:28px;transform:translate(-50%, 12px);z-index:99;
  font-size:11.5px;letter-spacing:.5px;color:var(--coffee);
  background:var(--white);border:1.5px solid var(--coffee);border-radius:6px;
  padding:7px 18px;box-shadow:0 6px 18px rgba(60,42,20,.15);
  opacity:0;pointer-events:none;transition:all .25s var(--ease);
}
.dean-toast.show{opacity:1;transform:translate(-50%, 0)}

/* ---- 翻页器：无框 · 居中 · 页码序列 + 橙色马克笔当前页 ---- */
.pg-hide{display:none!important}
.pager{
  flex:none;display:flex;align-items:center;justify-content:center;gap:4px;
  padding:2px 0 0;
}
.pager .pgbtn{
  width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;color:var(--coffee);
  transition:background .25s var(--ease), color .25s var(--ease), opacity .25s;
}
.pager .pgbtn svg{width:15px;height:15px}
.pager .pgbtn:hover:not(:disabled){background:rgba(255,127,0,.12);color:var(--orange)}
.pager .pgbtn:disabled{opacity:.22;cursor:not-allowed}
.pager .pgnums{display:flex;align-items:center;gap:2px;margin:0 2px}
.pager .pgnum{
  min-width:28px;height:28px;padding:0 6px;border-radius:4px;
  font-size:12px;letter-spacing:.5px;color:var(--ink-3);
  display:grid;place-items:center;
  transition:color .25s var(--ease);
}
.pager .pgnum:hover{color:var(--coffee)}
/* 当前页：沿用导航高亮的橙色马克笔 */
.pager .pgnum.on{
  color:var(--ink);font-weight:700;
  background:linear-gradient(180deg, transparent 60%, rgba(255,127,0,.46) 60%);
}
.pager .pgdots{color:var(--hair-2);font-size:12px;padding:0 1px;letter-spacing:1px}

.rise{opacity:0;transform:translateY(12px);animation:rise .7s var(--ease) forwards}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.rise{opacity:1;transform:none;animation:none}}

/* 窄屏 / 矮屏：放弃一屏固定，恢复自然滚动与正方形封面 */
@media (max-width:1024px), (max-height:680px){
  body{height:auto;min-height:100vh;overflow-y:auto;overflow-x:hidden}
  .home{flex:1 0 auto;padding:14px 20px 32px}
  .sec{flex:none}
  .grid{flex:none;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:auto}
  .card .cover{aspect-ratio:1/1;flex:none}
  .card .disc{height:auto;aspect-ratio:auto;position:absolute;inset:9%}
}
@media (max-width:720px){
  .nav-inner{padding:0 20px}
  .nav-links{display:none}
  .home{padding:12px 14px 28px}
  .c-head{flex-direction:column}
  .c-lib{width:100%;border-left:none;border-top:1px dashed var(--hair-2);padding:12px 0 0}
  .c-lib-list{max-height:140px}
  .c-cover{width:150px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
}
</style>
</head>

<script>
/* ================= 合集假数据 ================= */
const SET = {
  zone:'track',
  title:'指弹入门精选 · 第一辑',
  desc:'从易到难精选 12 首指弹曲：每首按「完整示范 → 分段精讲 → 伴奏跟练」编排，拿下前 4 首即可参加季度汇报演出。',
  updated:'昨天更新',
  books:[
    {nm:'民谣吉他入门一本通', m:'96 页'},
    {nm:'零基础乐理小课', m:'72 页'},
    {nm:'指弹吉他和弦与节奏图鉴', m:'128 页'}
  ],
  items:[
    {nm:'卡农 · 摇滚改编指弹版',              p:6, len:'24 分钟'},
    {nm:'天空之城 · 久石让 指弹版',           p:5, len:'20 分钟'},
    {nm:'Merry Christmas Mr. Lawrence',       p:5, len:'22 分钟'},
    {nm:'Wings · 押尾光太郎',                 p:6, len:'26 分钟'},
    {nm:'Time Travel · 岸部真明',             p:4, len:'19 分钟'},
    {nm:'风之丘 · 久石让 简化版',             p:3, len:'14 分钟'},
    {nm:'START · Depapepe',                   p:4, len:'17 分钟'},
    {nm:'七里香 · 指弹改编版',                p:5, len:'21 分钟'},
    {nm:'晴天 · 弹唱伴奏精编',                p:4, len:'16 分钟'},
    {nm:'童话 · 指弹改编版',                  p:3, len:'13 分钟'},
    {nm:'南山南 · 弹唱伴奏版',                p:4, len:'15 分钟'},
    {nm:'大鱼 · 指弹改编版',                  p:5, len:'20 分钟'},
  ],
};

/* ================= 渲染 ================= */
document.getElementById('zoneChip').textContent = '曲目集';
const bk = document.getElementById('backLink');
bk.textContent = '← 返回曲目库';
bk.href = 'tracks-home.html';
document.querySelectorAll('#navLinks a[data-zone]').forEach(a=>{
  a.classList.toggle('active', a.dataset.zone === 'track');
});
document.getElementById('cTitle').textContent = SET.title;
document.getElementById('crumbTitle').textContent = SET.title;
document.getElementById('cDesc').textContent = SET.desc;

const pTotal = SET.items.reduce((s,it)=>s+it.p, 0);
document.getElementById('metaLes').textContent = '收录 ' + SET.items.length + ' 首单曲';
document.getElementById('metaP').textContent = '共 ' + pTotal + ' 个 P';
document.getElementById('lesCount').textContent = SET.items.length + ' 首';
document.getElementById('libCount').textContent = SET.books.length + ' 本';
document.getElementById('libList').innerHTML = SET.books.map(it=>
  '<a class="c-lib-item" href="library-book.html">' +
    '<span class="book-mark" aria-hidden="true">书</span>' +
    '<span class="book-name">' + it.nm + '</span>' +
    '<span class="book-meta num">' + it.m + '</span>' +
  '</a>'
).join('');
document.getElementById('lesGrid').innerHTML = SET.items.map((it,i)=>
  '<a class="card" href="track-point-detail.html">' +
    '<div class="cover c' + (i%5+2) + '">' +
      '<span class="idx num">' + String(i+1).padStart(2,'0') + '</span>' +
      '<div class="disc"><i></i><span class="lbl"><i></i></span></div>' +
    '</div>' +
    '<div class="name">' + it.nm + '</div>' +
    '<div class="meta num"><span class="cnt-chip">' + it.p + ' 个 P</span><span>' + it.len + '</span></div>' +
  '</a>'
).join('');

/* ================= 分页：每页 2 行 × 6 列 = 12 个（无框页码 · 单页也常驻） ================= */
const PAGE_SIZE = 12;
const lesGrid = document.getElementById('lesGrid');
const lesPager = document.getElementById('lesPager');
const lesNums = document.getElementById('lesNums');
const lesCards = [...lesGrid.querySelectorAll('.card')];
let lesPage = 1;

/* 页码序列：≤7 页全部列出；更多时首尾 + 当前页邻域折叠 */
function pageSeq(cur, total){
  if(total <= 7) return Array.from({length:total}, (_,i)=>i+1);
  const list = [1];
  const s = Math.max(2, cur-1), e = Math.min(total-1, cur+1);
  if(s > 2) list.push('…');
  for(let i=s;i<=e;i++) list.push(i);
  if(e < total-1) list.push('…');
  list.push(total);
  return list;
}
function layoutLesPage(){
  const total = Math.max(1, Math.ceil(lesCards.length / PAGE_SIZE));
  lesPage = Math.min(Math.max(1, lesPage), total);
  lesCards.forEach((c,i)=> c.classList.toggle('pg-hide', !(i >= (lesPage-1)*PAGE_SIZE && i < lesPage*PAGE_SIZE)));
  lesNums.innerHTML = pageSeq(lesPage, total).map(v=> v === '…'
    ? '<span class="pgdots">…</span>'
    : '<button type="button" class="pgnum' + (v === lesPage ? ' on' : '') + '" data-p="' + v + '"'
      + ' aria-label="第 ' + v + ' 页"' + (v === lesPage ? ' aria-current="page"' : '') + '>' + v + '</button>'
  ).join('');
  lesPager.querySelector('[data-act="prev"]').disabled = lesPage <= 1;
  lesPager.querySelector('[data-act="next"]').disabled = lesPage >= total;
}
lesPager.querySelector('[data-act="prev"]').addEventListener('click', ()=>{ lesPage--; layoutLesPage(); });
lesPager.querySelector('[data-act="next"]').addEventListener('click', ()=>{ lesPage++; layoutLesPage(); });
lesNums.addEventListener('click', e=>{
  const b = e.target.closest('.pgnum'); if(!b) return;
  lesPage = parseInt(b.dataset.p, 10); layoutLesPage();
});
layoutLesPage();

/* ================= 预览视角（老师/学生/游客 = 浏览视角；教导主任 = 管理视角） ================= */
const vBtns = [...document.querySelectorAll('.viewseg button')];
function setView(dean){
  vBtns.forEach(b=>b.classList.toggle('on', (b.dataset.dean === '1') === dean));
  document.body.classList.toggle('dean', dean);
}
vBtns.forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.dean === '1')));

/* ================= 教导主任视角：卡片悬停操作层（查看详情 / 编辑 / 删除） ================= */
(function(){
  let toastTimer = null;
  function toast(msg){
    let t = document.querySelector('.dean-toast');
    if(!t){
      t = document.createElement('div');
      t.className = 'dean-toast';
      document.body.appendChild(t);
    }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>t.classList.remove('show'), 1600);
  }
  function syncCounts(){
    const left = lesGrid.querySelectorAll('.card').length;
    document.getElementById('lesCount').textContent = left + ' 首';
    document.getElementById('metaLes').textContent = '收录 ' + left + ' 首单曲';
  }
  lesGrid.querySelectorAll('.card').forEach(card=>{
    const ops = document.createElement('div');
    ops.className = 'ops';
    ops.innerHTML =
      '<button type="button" data-act="view">查看详情</button>' +
      '<button type="button" data-act="edit">编辑</button>' +
      '<button type="button" data-act="del" class="op-del">删除</button>';
    card.querySelector('.cover').appendChild(ops);
    ops.addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      const act = e.target.dataset && e.target.dataset.act;
      if(!act) return;
      if(act === 'del'){
        pendingCard = card;
        document.getElementById('delName').textContent = (card.querySelector('.name')||{}).textContent.trim();
        document.getElementById('delModal').classList.add('show');
      }else{
        toast(act === 'view' ? '演示：进入「' + (card.querySelector('.name')||{}).textContent.trim() + '」详情页' : '演示：进入编辑页');
      }
    });
  });

(function(){
  document.body.insertAdjacentHTML('beforeend', [
    '<div class="modal-mask" id="delModal" role="dialog" aria-modal="true" aria-label="删除确认">',
      '<div class="modal">',
        '<div class="modal-title">删 除 确 认</div>',
        '<p>确定要删除「<b id="delName"></b>」吗？<br>删除后该内容将不可恢复。</p>',
        '<div class="modal-ops">',
          '<button type="button" class="mbtn" id="delCancel">取 消</button>',
          '<button type="button" class="mbtn danger" id="delOk">确认删除</button>',
        '</div>',
      '</div>',
    '</div>'
  ].join(''));
})();
  /* ---- 删除确认弹层逻辑 ---- */
  let pendingCard = null;
  const mask = document.getElementById('delModal');
  function doDelete(){
    if(!pendingCard) return;
    const card = pendingCard; pendingCard = null;
    mask.classList.remove('show');
    const nm = (card.querySelector('.name')||{}).textContent.trim();
    card.style.transition = 'opacity .25s, transform .25s';
    card.style.opacity = '0'; card.style.transform = 'scale(.94)';
    setTimeout(()=>{
      const i = lesCards.indexOf(card);
      if(i > -1) lesCards.splice(i, 1);
      card.remove();
      syncCounts();
      layoutLesPage();
    }, 250);
    toast('演示：已从合集中移除「' + nm + '」');
  }
  document.getElementById('delOk').addEventListener('click', doDelete);
  document.getElementById('delCancel').addEventListener('click', closeDel);
  mask.addEventListener('click', e=>{ if(e.target === mask) closeDel(); });
  document.addEventListener('keydown', e=>{ if(e.key === 'Escape' && mask.classList.contains('show')) closeDel(); });
  function closeDel(){ pendingCard = null; mask.classList.remove('show'); }
})();
</script>
