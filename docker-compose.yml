services:
  postgres:
    image: postgres:16
    container_name: video_player_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_player
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

  backend:
    build:
      context: ./backend
    container_name: video_player_backend
    restart: always
    depends_on:
      - postgres
    env_file:
      - ./.env
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/video_player
    ports:
      - "3002:3000"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3002/api}
    container_name: video_player_frontend
    restart: always
    depends_on:
      - backend
    environment:
      SERVER_API_BASE_URL: http://backend:3002/api
    ports:
      - "3001:3001"

volumes:
  postgres_data:
    name: video_player_postgres_data
