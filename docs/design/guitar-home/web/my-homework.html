<style>
/* ============================================================
   我的历史作业 · 学员
   按 operation 聚合展示历次推送（推送内容 + 老师留言 + 时间）
   视觉遵循 design-spec v1.0
============================================================ */
:root{
  --paper:  #f2ead9;
  --white:  #ffffff;
  --ink:    #261d10;
  --ink-2:  #4f4230;
  --ink-3:  #7a6a52;
  --hair:   #ddd0b4;
  --hair-2: #c9b795;
  --coffee: #5d4326;
  --orange: #ff7f00;
  --amber:  #b98e3e;
  --green:  #4f7d3a;
  --wood:   #3a2a18;
  --glass:      rgba(255, 255, 255, .85);
  --glass-line: rgba(93, 67, 38, .32);
  --font-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  --ease: cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:var(--font-body);
  background:#ffffff;  /* 纯白底 + 格纹底饰（design-spec v2.0 §3） */
  color:var(--ink);
  font-size:14.5px;line-height:1.65;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;
  overflow-x:hidden;overflow-y:auto;  /* 页面整体滚动（时间线不再框内滚） */
}
/* 格纹底饰：焦糖咖啡色 · 下浓上淡 · 近页头逐渐消失（design-spec v2.0 §3） */
body::after{display:none}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background:
    repeating-linear-gradient(90deg, rgba(122,74,38,.16) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(0deg,  rgba(122,74,38,.16) 0 1px, transparent 1px 72px),
    repeating-linear-gradient(90deg, rgba(122,74,38,.06) 0 1px, transparent 1px 18px),
    repeating-linear-gradient(0deg,  rgba(122,74,38,.06) 0 1px, transparent 1px 18px);
  -webkit-mask:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.12) 30%, rgba(0,0,0,.55) 62%, #000 100%);
          mask:linear-gradient(180deg, transparent 0%, rgba(0,0,0,.12) 30%, rgba(0,0,0,.55) 62%, #000 100%);
}
::selection{background:#ecd9ae}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,a:focus-visible{outline:1.5px solid var(--ink);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}

/* ============ 导航（学员） ============ */
.nav{
  position:relative;flex:none;z-index:50;
  background:var(--white);
  border-bottom:1px solid var(--glass-line);
  box-shadow:0 1px 8px rgba(64,45,20,.07);
}
.nav::before{
  content:"";position:absolute;bottom:0;left:0;right:0;height:3px;
  background:var(--coffee);
}
.nav-inner{max-width:1440px;margin:0 auto;padding:0 36px;height:56px;display:flex;align-items:center;gap:40px;position:relative}
.logo{display:flex;align-items:baseline;gap:9px;font-size:15.5px;font-weight:700;letter-spacing:3px;color:var(--ink);text-decoration:none}
.logo .mark{width:9px;height:9px;background:var(--orange);flex:none;align-self:center}
.logo small{font-size:10px;letter-spacing:2px;color:var(--ink-3);font-weight:400}
.nav-links{display:flex;gap:32px;flex:1}
.nav-links a{
  color:var(--ink-2);text-decoration:none;font-size:13px;letter-spacing:1px;
  padding:4px 3px 7px;position:relative;transition:color .3s var(--ease);
}
.nav-links a.active{
  color:var(--ink);font-weight:600;
  background:linear-gradient(180deg, transparent 58%, rgba(255,127,0,.42) 58%);
}
.nav-links a:hover{color:var(--ink)}
.nav-right{display:flex;align-items:center;gap:18px}
.avatar{
  position:relative;width:34px;height:34px;border-radius:50%;
  border:1.5px solid var(--coffee);background:var(--white);
  display:grid;place-items:center;font-size:12.5px;color:var(--coffee);font-weight:600;
}
.avatar::after{
  content:"";position:absolute;top:-1px;right:-1px;width:9px;height:9px;border-radius:50%;
  background:var(--green);border:1.5px solid var(--paper);
}

/* ============ 主区 ============ */
.home{flex:1;min-height:0;max-width:1180px;width:100%;margin:0 auto;padding:14px 36px 20px;display:flex;flex-direction:column;gap:12px}

/* ---- 工具行 ---- */
.toolrow{flex:none;display:flex;align-items:center;gap:14px}
.toolrow h1{font-size:16px;font-weight:700;letter-spacing:2px;color:var(--ink);display:flex;align-items:center;gap:9px}
.toolrow h1::before{content:"";width:4px;height:15px;border-radius:1px;background:var(--orange)}
.toolrow .hint{font-size:10.5px;color:var(--ink-3);letter-spacing:.5px}
.viewseg{margin-left:auto;display:flex;align-items:center;gap:0;border:1px solid var(--hair-2);border-radius:4px;overflow:hidden;background:var(--white)}
.viewseg .lbl{font-size:10px;letter-spacing:1.5px;color:var(--ink-3);padding:0 10px;border-right:1px dashed var(--hair-2)}
.viewseg button{font-size:11px;letter-spacing:1px;color:var(--ink-3);padding:5px 13px;transition:all .25s}
.viewseg button + button{border-left:1px solid var(--hair)}
.viewseg button.on{background:var(--coffee);color:var(--white);font-weight:600}

/* ---- 停用横幅 ---- */
.stop-banner{
  flex:none;display:none;align-items:flex-start;gap:12px;
  border:1.5px dashed rgba(180,69,46,.55);border-radius:6px;
  background:rgba(255,252,242,.85);
  padding:12px 18px;
}
body.disabled .stop-banner{display:flex}
.stop-banner .ico{
  flex:none;width:30px;height:30px;border-radius:50%;margin-top:2px;
  border:1.5px solid rgba(180,69,46,.5);background:rgba(180,69,46,.06);
  display:grid;place-items:center;color:#b4452e;
}
.stop-banner .ico svg{width:15px;height:15px}
.stop-banner .t{font-size:12.5px;color:var(--ink);letter-spacing:.5px;line-height:1.8}
.stop-banner .t b{color:#b4452e}

/* ---- 历史作业记录列表（与老师端学习记录组件一致） ---- */
.zone{
  flex:none;position:relative;
  border:0;border-radius:0;
  background:rgba(255,255,255,.76);
  box-shadow:none;
  overflow:hidden;
}
.rec-list{padding:6px 14px 14px}
.hw-item{
  display:flex;gap:12px;
  padding:10px 0 11px;border-bottom:1px solid rgba(221,208,180,.55);
}
.hw-item:last-child{border-bottom:none}
/* 已删除记录：整条变灰留痕 */
.hw-item.deleted .hw-tm,.hw-item.deleted .hw-main{filter:grayscale(1);opacity:.45}
.hw-delnote{
  margin-top:6px;font-size:10px;letter-spacing:.4px;color:#8a7a60;
  border-top:1px dashed var(--hair);padding-top:5px;
}
.hw-delnote b{color:#8a5a3e;font-weight:600}
.hw-tm{flex:none;width:52px;padding-top:2px;text-align:center}
.hw-tm .tm{font-size:13px;font-weight:700;color:var(--coffee);letter-spacing:.5px}
.hw-tm .lb{font-size:9px;color:var(--ink-3);letter-spacing:1px;margin-top:1px}
.hw-main{flex:1;min-width:0}
.hw-from{font-size:11px;color:var(--ink-3);letter-spacing:.4px;margin-bottom:5px}
.hw-from b{color:var(--ink-2);font-weight:600}
.hw-msg-pair{display:flex;flex-direction:column;gap:5px;margin-bottom:7px}
.hw-msg-line{
  display:flex;align-items:flex-start;gap:5px;min-width:0;
  font-size:11px;line-height:1.7;color:var(--ink-2);letter-spacing:.3px;
  background:rgba(93,67,38,.035);border:1px solid rgba(93,67,38,.16);border-radius:4px;
  padding:4px 9px;
}
.hw-msg-label{flex:none;width:70px;color:var(--coffee);font-weight:700;white-space:nowrap}
.hw-msg-text{
  min-width:0;flex:1;max-height:calc(1.7em * 5);overflow-y:auto;
  scrollbar-width:thin;scrollbar-color:var(--hair-2) transparent;
  overflow-wrap:anywhere;white-space:pre-wrap;word-break:break-word;
}
.hw-msg-text::-webkit-scrollbar{width:3px}
.hw-msg-text::-webkit-scrollbar-thumb{background:var(--hair-2)}
.hw-items{display:flex;flex-wrap:wrap;gap:4px 16px;margin-bottom:7px}
.hw-items .it{
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;font-weight:600;color:var(--ink-2);letter-spacing:.3px;
}
.hw-items .it::before{content:"";width:4px;height:4px;border-radius:50%;background:#a06a35;flex:none}
.rec-empty{
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:80px 10px;text-align:center;color:var(--ink-3);font-size:12.5px;letter-spacing:.5px;
}
.rec-empty.show{display:flex}
.rec-empty .big{font-size:15px;color:var(--ink);font-weight:700;letter-spacing:1px}
.rec-empty .big mark{background:linear-gradient(180deg, transparent 55%, rgba(255,127,0,.46) 55%);color:inherit;padding:0 3px}

/* 回到顶部（时间线旁 · 右下角） */
.to-top{
  position:fixed;right:30px;bottom:34px;z-index:60;
  width:38px;height:38px;border-radius:50%;
  border:1.5px solid var(--coffee);background:var(--white);color:var(--coffee);
  display:grid;place-items:center;
  box-shadow:0 2px 8px rgba(64,45,20,.16);
  opacity:0;pointer-events:none;transform:translateY(8px);
  transition:all .3s var(--ease);
}
.to-top.show{opacity:1;pointer-events:auto;transform:translateY(0)}
.to-top:hover{background:var(--coffee);color:var(--white)}
.to-top svg{width:16px;height:16px}

.rise{opacity:0;transform:translateY(12px);animation:rise .7s var(--ease) forwards}
.rise.d1{animation-delay:.08s}.rise.d2{animation-delay:.16s}
@keyframes rise{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){.rise{opacity:1;transform:none;animation:none}}

@media (max-width:1024px){
  body{overflow:auto;display:block}
  .home{padding:14px 20px 40px}
}
@media (max-width:640px){
  .nav-inner{padding:0 20px}
  .nav-links{display:none}
  .home{padding:12px 14px 32px}
  .op{flex-direction:column;gap:6px;margin-left:0;padding-left:14px}
  .op::before{left:2px}
  .op-side{width:auto;text-align:left;display:flex;gap:10px;align-items:baseline}
  .viewseg{margin-left:0}
  .toolrow{flex-wrap:wrap}
}
</style>

<script>
/* ================= 假数据（每次推送 = 一条独立作业记录） ================= */
const OPS = [
  {d:'今天', tm:'20:30', from:'李弦安',
   practice:'重点看 P2 的段落衔接，跟练时开节拍器 60。\n第二遍试着把速度提到 72。',
   submit:'请拍摄完整练习视频，保持画面稳定并上传。',
   items:['卡农独奏 · 全曲精讲','卡农 · P2 分段讲解']},
  {d:'今天', tm:'18:00', from:'李弦安',
   practice:'先完成基础指法练习。',
   submit:'',
   items:['指弹入门 30 首']},
  {d:'9月6日', tm:'19:12', from:'李弦安',
   practice:'',
   submit:'',
   items:['指弹入门 30 首']},
  {d:'9月5日', tm:'21:47', from:'李弦安',
   practice:'天空之城全曲过一遍，P2 慢速跟练三遍再提速。',
   submit:'请提交慢速跟练视频，能看清左右手动作。',
   items:['天空之城 · 指弹改编','天空之城 · P2 分段讲解']},
  {d:'9月2日', tm:'18:05', from:'李弦安',
   practice:'',
   submit:'提交一段连续演奏视频即可。',
   items:['晴天 · 前奏精讲','晴天 · P1 前奏演示']},
  {d:'8月29日', tm:'20:22', from:'李弦安',
   practice:'这周把风之诗的引子磨下来，不用赶。',
   submit:'',
   items:['风之诗 · Wind Song']},
  {d:'8月25日', tm:'19:40', from:'李弦安',
   practice:'',
   submit:'',
   items:['宫崎骏动画曲集','千与千寻 · Always With Me'],
   del:{by:'李弦安', reason:'重复布置'}},
  {d:'8月20日', tm:'20:11', from:'李弦安',
   practice:'乐谱在附件里，看不懂的地方课上问。',
   submit:'请录制并提交完整演奏视频。',
   items:['奇迹的山']},
];

/* ================= 渲染（按作业记录展示，不按日期合并） ================= */
const recList = document.getElementById('recList');
function render(){
  if(!OPS.length){
    document.getElementById('recEmpty').classList.add('show');
    document.getElementById('cntHint').textContent = '暂无记录';
    return;
  }
  document.getElementById('cntHint').textContent = '共 ' + OPS.length + ' 条记录 · 按时间倒序';
  recList.innerHTML = OPS.map(o=>{
    const practiceMsg = (o.practice || '').trim();
    const submitMsg = (o.submit || '').trim();
    return '<div class="hw-item' + (o.del ? ' deleted' : '') + '">' +
      '<span class="hw-tm num"><span class="tm">' + o.tm + '</span><div class="lb">' + o.d + '</div></span>' +
      '<span class="hw-main">' +
        '<div class="hw-from"><b>' + o.from + '</b>老师 · 布置</div>' +
        ((o.items && o.items.length) ? '<div class="hw-items">' +
          o.items.map(t=>'<span class="it">' + t + '</span>').join('') +
        '</div>' : '') +
        ((practiceMsg || submitMsg) ? '<div class="hw-msg-pair">' +
          (practiceMsg ? '<div class="hw-msg-line"><span class="hw-msg-label">练习要求：</span><span class="hw-msg-text">' + practiceMsg + '</span></div>' : '') +
          (submitMsg ? '<div class="hw-msg-line"><span class="hw-msg-label">提交要求：</span><span class="hw-msg-text">' + submitMsg + '</span></div>' : '') +
        '</div>' : '') +
        (o.del
          ? '<div class="hw-delnote">已删除 · 删除人：<b>' + o.del.by + '</b> · 原因：' + o.del.reason + '</div>'
          : '') +
      '</span>' +
    '</div>';
  }).join('');
}
render();

/* ================= 视角切换（学员 / 停用学员） ================= */
document.querySelectorAll('.viewseg button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.viewseg button').forEach(x=>x.classList.toggle('on', x===b));
    document.body.classList.toggle('disabled', b.dataset.v === 'disabled');
  });
});

/* ================= 回到顶部 ================= */
const toTop = document.getElementById('toTop');
window.addEventListener('scroll', ()=>{
  toTop.classList.toggle('show', window.scrollY > 240);
}, {passive:true});
toTop.addEventListener('click', ()=>{
  window.scrollTo({top:0, behavior:'smooth'});
});
</script>
